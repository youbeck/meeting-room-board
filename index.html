<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會議室預約看板</title>
<style>
  :root {
    --free: #d9f2e1; --free-border: #7bc895; --free-hover: #bfe8cd;
    --booked: #cfe0fb; --booked-border: #6d97df; --booked-hover: #b8d0f7;
    --past: #e4e4e4; --past-text: #8a8a8a;
    --text: #222; --bg: #f5f6f8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; background: var(--bg); color: var(--text); }
  h1 { margin: 0 0 12px; font-size: 1.4rem; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toolbar .date { font-size: 1.1rem; font-weight: bold; min-width: 11em; text-align: center; }
  button { font: inherit; cursor: pointer; }
  .toolbar button { padding: 6px 12px; border: 1px solid #aaa; border-radius: 6px; background: #fff; }
  .toolbar button:disabled { opacity: .4; cursor: not-allowed; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .85rem; margin-bottom: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; border: 1px solid #888; }
  .legend .l-free::before { background: var(--free); }
  .legend .l-booked::before { background: var(--booked); }
  .legend .l-past::before { background: var(--past); }
  .hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; font-size: .9rem; }
  .hint .msg-err { color: #c0392b; }
  .hint button { padding: 2px 10px; border: 1px solid #aaa; border-radius: 6px; background: #fff; }
  .cell.picked { background: #ffe6a8; border-color: #e0a800; box-shadow: 0 0 0 2px #e0a800 inset; font-weight: bold; }
  .scroll { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 4px; min-width: 760px; width: 100%; table-layout: fixed; }
  th { font-size: .85rem; font-weight: normal; padding: 4px; }
  th.room { width: 90px; font-weight: bold; text-align: left; }
  td { padding: 0; height: 64px; }
  .cell { width: 100%; height: 100%; padding: 4px; border-radius: 6px; border: 1px solid; font-size: .8rem; overflow: hidden; text-align: left; line-height: 1.3; }
  .cell.free { background: var(--free); border-color: var(--free-border); }
  .cell.free:hover { background: var(--free-hover); }
  .cell.booked { background: var(--booked); border-color: var(--booked-border); }
  .cell.booked:hover { background: var(--booked-hover); }
  .cell.past { background: var(--past); border-color: #c8c8c8; color: var(--past-text); cursor: not-allowed; }
  .cell .who { font-weight: bold; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .topic { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h2.list-title { margin: 20px 0 8px; font-size: 1.1rem; }
  .list-wrap { overflow-x: auto; background: #fff; border: 1px solid #d5d5d5; border-radius: 8px; }
  table.list { border-collapse: collapse; width: 100%; min-width: 560px; table-layout: auto; }
  table.list th, table.list td { height: auto; padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; font-size: .9rem; }
  table.list th { font-weight: bold; background: #fafafa; }
  table.list .del { padding: 4px 10px; border: 1px solid #c0392b; border-radius: 6px; background: #fff; color: #c0392b; }
  table.list .del:hover { background: #fdecea; }
  .empty { padding: 14px; color: #666; font-size: .9rem; }
  dialog select { display: block; width: 100%; margin-top: 4px; padding: 6px; font: inherit; border: 1px solid #aaa; border-radius: 4px; }
  .note { margin-top: 12px; font-size: .85rem; color: #555; }
  dialog { border: 1px solid #888; border-radius: 10px; padding: 16px; width: min(92vw, 360px); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 4px; font-size: 1.1rem; }
  dialog .info { margin: 0 0 12px; font-size: .9rem; color: #444; }
  dialog label { display: block; margin-bottom: 10px; font-size: .9rem; }
  dialog input { display: block; width: 100%; margin-top: 4px; padding: 6px; font: inherit; border: 1px solid #aaa; border-radius: 4px; }
  .error { min-height: 1.2em; margin: 0 0 8px; color: #c0392b; font-size: .85rem; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .actions button { padding: 6px 14px; border: 1px solid #aaa; border-radius: 6px; background: #fff; }
  .actions .primary { background: #2f6fdd; border-color: #2f6fdd; color: #fff; }
  .actions .danger { background: #c0392b; border-color: #c0392b; color: #fff; }
  @media (max-width: 600px) { body { padding: 10px; } .toolbar .date { min-width: 0; flex: 1 1 100%; order: -1; } }
</style>
</head>
<body>
<h1>會議室預約看板</h1>

<div class="toolbar">
  <button id="prev" type="button">◀ 前一天</button>
  <span class="date" id="dateLabel"></span>
  <button id="next" type="button">後一天 ▶</button>
  <button id="today" type="button">回到今天</button>
</div>

<div class="legend">
  <span class="l-free">可預約</span>
  <span class="l-booked">已預約</span>
  <span class="l-past">已過／不可預約</span>
</div>

<p class="hint" id="hint"></p>

<div class="scroll"><table id="grid" aria-label="會議室預約網格"></table></div>

<h2 class="list-title">目前所有預約</h2>
<div class="list-wrap" id="listWrap"></div>

<p class="note">說明：預約資料僅存於本瀏覽器的 localStorage，不會跨使用者或裝置同步。取消時比對姓名僅為防止誤刪，並非安全機制。僅可預約今天起 14 天內的平日。</p>

<dialog id="bookDialog">
  <form method="dialog" id="bookForm" novalidate>
    <h2>預約會議室</h2>
    <p class="info" id="bookInfo"></p>
    <label>姓名<input id="bookName" type="text" maxlength="30" autocomplete="off"></label>
    <label>會議主題<input id="bookTopic" type="text" maxlength="60" autocomplete="off"></label>
    <p class="error" id="bookError" role="alert"></p>
    <div class="actions">
      <button type="button" id="bookCancel">取消</button>
      <button type="submit" class="primary">送出預約</button>
    </div>
  </form>
</dialog>

<dialog id="cancelDialog">
  <form method="dialog" id="cancelForm" novalidate>
    <h2>修改／刪除預約</h2>
    <p class="info" id="cancelInfo"></p>
    <label>原預約人姓名（驗證用，須與預約時相符）<input id="cancelName" type="text" maxlength="30" autocomplete="off"></label>
    <label>開始時間<select id="editStart"></select></label>
    <label>結束時間<select id="editEnd"></select></label>
    <label>姓名<input id="editName" type="text" maxlength="30" autocomplete="off"></label>
    <label>會議主題<input id="editTopic" type="text" maxlength="60" autocomplete="off"></label>
    <p class="error" id="cancelError" role="alert"></p>
    <div class="actions">
      <button type="button" id="cancelClose">返回</button>
      <button type="button" id="cancelDelete" class="danger">刪除預約</button>
      <button type="submit" class="primary">儲存修改</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'meetingRoomBookings';
  var ROOMS = [{ id: 'A', name: '會議室 A' }, { id: 'B', name: '會議室 B' }, { id: 'C', name: '會議室 C' }];
  var HOURS = [9, 10, 11, 12, 13, 14, 15, 16, 17]; // 09:00–18:00，共 9 格
  var END_HOUR = 18;
  var MAX_DAYS = 14;
  var WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

  // ===== 日期工具（一律使用本地時間，不用 toISOString）=====
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function isWeekday(d) { var w = d.getDay(); return w !== 0 && w !== 6; }
  function nextWeekday(d) { var r = addDays(d, 1); while (!isWeekday(r)) r = addDays(r, 1); return r; }
  function prevWeekday(d) { var r = addDays(d, -1); while (!isWeekday(r)) r = addDays(r, -1); return r; }
  function hourLabel(h) { return pad(h) + ':00'; }

  // 可瀏覽範圍：今天（若為週末則下一個平日）～ 今天 + 14 天內最後一個平日
  function range() {
    var today = startOfDay(new Date());
    var first = isWeekday(today) ? today : nextWeekday(today);
    var last = addDays(today, MAX_DAYS);
    while (!isWeekday(last)) last = addDays(last, -1);
    return { first: first, last: last };
  }

  // 過去時段：日期早於今天，或今天且起始整點小於目前整點
  function isPast(date, hour) {
    var now = new Date();
    var today = startOfDay(now);
    if (date < today) return true;
    return dateKey(date) === dateKey(today) && hour < now.getHours();
  }

  // ===== 資料存取（容錯：空、壞 JSON、localStorage 不可用都退回空物件）=====
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || Array.isArray(data)) return {};
      // 正規化：舊資料沒有 hours 視為 1；不合法的 hours 也退回 1
      var clean = {};
      Object.keys(data).forEach(function (key) {
        var b = data[key];
        var start = parseInt(key.split('|')[2], 10);
        if (!b || typeof b !== 'object' || isNaN(start)) return;
        var h = b.hours;
        if (!Number.isInteger(h) || h < 1 || start + h > END_HOUR) h = 1;
        clean[key] = { name: String(b.name), topic: String(b.topic), hours: h };
      });
      return clean;
    } catch (e) {
      return {};
    }
  }
  function save(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      return false;
    }
  }
  function bookingKey(date, roomId, hour) { return dateKey(date) + '|' + roomId + '|' + hour; }

  // 找出涵蓋某日某房間某小時的預約（含連續時段）；沒有則回傳 null
  function findBooking(data, dateStr, roomId, hour) {
    var keys = Object.keys(data);
    for (var i = 0; i < keys.length; i++) {
      var p = keys[i].split('|');
      if (p[0] !== dateStr || p[1] !== roomId) continue;
      var s = parseInt(p[2], 10);
      if (s <= hour && hour < s + data[keys[i]].hours) return { key: keys[i], start: s, b: data[keys[i]] };
    }
    return null;
  }
  function parseDateStr(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dateText(d) {
    return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '（週' + WEEKDAY_NAMES[d.getDay()] + '）';
  }
  function roomName(id) { return ROOMS.filter(function (r) { return r.id === id; })[0].name; }
  function rangeText(start, hours) { return hourLabel(start) + '–' + hourLabel(start + hours); }

  // ===== 狀態與元素 =====
  var current = range().first;
  var grid = document.getElementById('grid');
  var dateLabel = document.getElementById('dateLabel');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var todayBtn = document.getElementById('today');
  var bookDialog = document.getElementById('bookDialog');
  var cancelDialog = document.getElementById('cancelDialog');
  var selecting = null; // 兩段式選取中的起點 { dateStr, roomId, start }
  var hintError = '';
  var pending = null; // 目前對話框的操作對象：預約 { date, room, hour }；取消 { key }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ===== 渲染 =====
  function render() {
    var r = range();
    var data = load();
    dateLabel.textContent = dateText(current);
    prevBtn.disabled = current <= r.first;
    nextBtn.disabled = current >= r.last;
    todayBtn.disabled = dateKey(current) === dateKey(r.first);

    if (selecting && selecting.dateStr !== dateKey(current)) { selecting = null; hintError = ''; }
    renderHint();

    grid.textContent = '';
    var head = el('tr');
    head.appendChild(el('th', 'room', '會議室'));
    HOURS.forEach(function (h) { head.appendChild(el('th', '', hourLabel(h) + '–' + hourLabel(h + 1))); });
    grid.appendChild(head);

    var dStr = dateKey(current);
    ROOMS.forEach(function (room) {
      var tr = el('tr');
      tr.appendChild(el('th', 'room', room.name));
      HOURS.forEach(function (h) {
        var hit = findBooking(data, dStr, room.id, h);
        if (hit && hit.start < h) return; // 連續預約被前面的格子合併，不再輸出
        var td = el('td');
        var btn = el('button', 'cell');
        btn.type = 'button';
        if (hit) {
          td.colSpan = hit.b.hours;
          btn.className += ' booked';
          btn.appendChild(el('span', 'who', hit.b.name));
          btn.appendChild(el('span', 'topic', hit.b.topic));
          btn.title = rangeText(hit.start, hit.b.hours) + ' ' + hit.b.name + '：' + hit.b.topic + '（點擊可修改或刪除）';
          btn.addEventListener('click', function () { selecting = null; hintError = ''; render(); openCancel(hit.key); });
        } else if (isPast(current, h)) {
          btn.className += ' past';
          btn.disabled = true;
          btn.textContent = '不可預約';
        } else {
          var isStart = selecting && selecting.roomId === room.id && selecting.start === h;
          btn.className += isStart ? ' picked' : ' free';
          btn.textContent = isStart ? '起點' : '可預約';
          btn.addEventListener('click', function () { onFreeClick(room, h); });
        }
        td.appendChild(btn);
        tr.appendChild(td);
      });
      grid.appendChild(tr);
    });
    renderList(data);
  }

  // ===== 預約列表（全部日期，可修改／刪除）=====
  function renderList(data) {
    var wrap = document.getElementById('listWrap');
    wrap.textContent = '';
    var keys = Object.keys(data).sort(function (a, b) {
      var pa = a.split('|'), pb = b.split('|');
      if (pa[0] !== pb[0]) return pa[0] < pb[0] ? -1 : 1;
      if (+pa[2] !== +pb[2]) return +pa[2] - +pb[2];
      return pa[1] < pb[1] ? -1 : 1;
    });
    if (!keys.length) { wrap.appendChild(el('p', 'empty', '目前沒有任何預約')); return; }
    var table = el('table', 'list');
    var hr = el('tr');
    ['日期', '時間', '會議室', '姓名', '會議主題', ''].forEach(function (t) { hr.appendChild(el('th', '', t)); });
    table.appendChild(hr);
    keys.forEach(function (key) {
      var p = key.split('|');
      var b = data[key];
      var tr = el('tr');
      tr.appendChild(el('td', '', dateText(parseDateStr(p[0]))));
      tr.appendChild(el('td', '', rangeText(parseInt(p[2], 10), b.hours)));
      tr.appendChild(el('td', '', roomName(p[1])));
      tr.appendChild(el('td', '', b.name));
      tr.appendChild(el('td', '', b.topic));
      var act = el('td');
      var del = el('button', 'del', '修改／刪除');
      del.type = 'button';
      del.addEventListener('click', function () { openCancel(key); });
      act.appendChild(del);
      tr.appendChild(act);
      table.appendChild(tr);
    });
    wrap.appendChild(table);
  }

  // ===== 預約：先點起點，再點終點；期間皆空才跳出輸入資訊 =====
  function renderHint() {
    var h = document.getElementById('hint');
    h.textContent = '';
    if (!selecting) {
      h.appendChild(el('span', '', '預約方式：先點「起始時段」，再點「結束時段」（同一間會議室）；點同一格即預約 1 小時。'));
    } else {
      h.appendChild(el('span', '', '起點：' + roomName(selecting.roomId) + ' ' + hourLabel(selecting.start) + '，請點選結束時段。'));
      var c = el('button', '', '取消選取');
      c.type = 'button';
      c.addEventListener('click', clearSelection);
      h.appendChild(c);
    }
    if (hintError) h.appendChild(el('span', 'msg-err', hintError));
  }
  function clearSelection() { selecting = null; hintError = ''; render(); }

  function onFreeClick(room, h) {
    var dStr = dateKey(current);
    // 尚未選起點、換了會議室、或點到起點之前：以此格為新起點
    if (!selecting || selecting.roomId !== room.id || h < selecting.start) {
      selecting = { dateStr: dStr, roomId: room.id, start: h };
      hintError = '';
      render();
      return;
    }
    var data = load();
    for (var x = selecting.start; x <= h; x++) {
      if (findBooking(data, dStr, room.id, x) || isPast(current, x)) {
        selecting = { dateStr: dStr, roomId: room.id, start: h };
        hintError = '起點到終點之間有已被預約的時段，無法預約，已改以此格為新的起點。';
        render();
        return;
      }
    }
    hintError = '';
    openBook(room, selecting.start, h - selecting.start + 1);
  }

  function openBook(room, hour, hours) {
    pending = { date: current, room: room, hour: hour, hours: hours };
    document.getElementById('bookInfo').textContent = dateText(current) + ' ' + room.name + ' ' + rangeText(hour, hours) + '（共 ' + hours + ' 小時）';
    document.getElementById('bookName').value = '';
    document.getElementById('bookTopic').value = '';
    document.getElementById('bookError').textContent = '';
    bookDialog.showModal();
    document.getElementById('bookName').focus();
  }
  // 對話框以任何方式關閉後，清除選取狀態
  bookDialog.addEventListener('close', clearSelection);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && selecting && !bookDialog.open && !cancelDialog.open) clearSelection();
  });

  document.getElementById('bookForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var err = document.getElementById('bookError');
    var name = document.getElementById('bookName').value.trim();
    var topic = document.getElementById('bookTopic').value.trim();
    if (!name || !topic) { err.textContent = '姓名與會議主題皆為必填。'; return; }
    var p = pending;
    var hours = p.hours;
    var r = range();
    if (p.date < r.first || p.date > r.last || !isWeekday(p.date)) { err.textContent = '此日期不可預約。'; return; }
    if (isPast(p.date, p.hour)) { err.textContent = '此時段已過，無法預約。'; return; }
    if (!Number.isInteger(hours) || hours < 1 || p.hour + hours > END_HOUR) { err.textContent = '結束時間不正確。'; return; }
    var data = load();
    var dStr = dateKey(p.date);
    for (var h = p.hour; h < p.hour + hours; h++) {
      if (findBooking(data, dStr, p.room.id, h)) { err.textContent = '所選時段已有人預約，請重新選擇。'; return; }
    }
    data[bookingKey(p.date, p.room.id, p.hour)] = { name: name, topic: topic, hours: hours };
    if (!save(data)) { err.textContent = '無法寫入瀏覽器儲存空間，預約未儲存。'; return; }
    bookDialog.close();
    clearSelection();
  });
  document.getElementById('bookCancel').addEventListener('click', function () { bookDialog.close(); clearSelection(); });

  // ===== 修改／刪除（網格與列表共用，以預約 key 定位；沿用 cancelDialog 的元素 id）=====
  function fillHourSelect(sel, from, to, value) {
    sel.textContent = '';
    for (var h = from; h <= to; h++) {
      var opt = el('option', '', hourLabel(h));
      opt.value = String(h);
      sel.appendChild(opt);
    }
    sel.value = String(value);
  }

  function openCancel(key) {
    var b = load()[key];
    if (!b) { render(); return; }
    pending = { key: key };
    var p = key.split('|');
    var start = parseInt(p[2], 10);
    document.getElementById('cancelInfo').textContent = dateText(parseDateStr(p[0])) + ' ' + roomName(p[1]) + '（日期與會議室不可修改，要換請刪除重訂）';
    document.getElementById('cancelName').value = '';
    fillHourSelect(document.getElementById('editStart'), HOURS[0], END_HOUR - 1, start);
    fillHourSelect(document.getElementById('editEnd'), HOURS[0] + 1, END_HOUR, start + b.hours);
    document.getElementById('editName').value = b.name;
    document.getElementById('editTopic').value = b.topic;
    document.getElementById('cancelError').textContent = '';
    cancelDialog.showModal();
    document.getElementById('cancelName').focus();
  }

  // 刪除：姓名須與預約時相符
  document.getElementById('cancelDelete').addEventListener('click', function () {
    var err = document.getElementById('cancelError');
    var data = load();
    var key = pending.key;
    var b = data[key];
    if (!b) { cancelDialog.close(); render(); return; }
    if (document.getElementById('cancelName').value.trim() !== b.name.trim()) { err.textContent = '姓名與預約時不符，預約已保留。'; return; }
    delete data[key];
    if (!save(data)) { err.textContent = '無法寫入瀏覽器儲存空間，刪除未生效。'; return; }
    cancelDialog.close();
    render();
  });

  // 修改：姓名驗證通過後，可改開始／結束時間、姓名、主題（同一天、同一會議室）
  document.getElementById('cancelForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var err = document.getElementById('cancelError');
    var data = load();
    var key = pending.key;
    var old = data[key];
    if (!old) { cancelDialog.close(); render(); return; }
    if (document.getElementById('cancelName').value.trim() !== old.name.trim()) { err.textContent = '姓名與預約時不符，預約未修改。'; return; }
    var name = document.getElementById('editName').value.trim();
    var topic = document.getElementById('editTopic').value.trim();
    if (!name || !topic) { err.textContent = '姓名與會議主題皆為必填。'; return; }
    var p = key.split('|');
    var oldStart = parseInt(p[2], 10);
    var s = parseInt(document.getElementById('editStart').value, 10);
    var e = parseInt(document.getElementById('editEnd').value, 10);
    if (!(e > s) || s < HOURS[0] || e > END_HOUR) { err.textContent = '結束時間須晚於開始時間。'; return; }
    var hours = e - s;
    if ((s !== oldStart || hours !== old.hours) && isPast(parseDateStr(p[0]), s)) { err.textContent = '新的開始時段已過，無法修改。'; return; }
    for (var h = s; h < e; h++) {
      var hit = findBooking(data, p[0], p[1], h);
      if (hit && hit.key !== key) { err.textContent = '新的時段與其他預約衝突，預約未修改。'; return; }
    }
    delete data[key];
    data[p[0] + '|' + p[1] + '|' + s] = { name: name, topic: topic, hours: hours };
    if (!save(data)) { err.textContent = '無法寫入瀏覽器儲存空間，修改未生效。'; return; }
    cancelDialog.close();
    render();
  });
  document.getElementById('cancelClose').addEventListener('click', function () { cancelDialog.close(); });

  // ===== 日期切換 =====
  prevBtn.addEventListener('click', function () { current = prevWeekday(current); render(); });
  nextBtn.addEventListener('click', function () { current = nextWeekday(current); render(); });
  todayBtn.addEventListener('click', function () { current = range().first; render(); });

  render();
})();
</script>
</body>
</html>
